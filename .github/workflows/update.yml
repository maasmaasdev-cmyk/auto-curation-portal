name: Daily Auto Update & Deploy

on:
  schedule:
    # 毎日 午前6時（JST = UTC 21:00）に自動実行
    - cron: '0 21 * * *'
  workflow_dispatch: # ボタンひとつで手動即時実行も可能

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Update Script
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: |
          python scripts/update_deals.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update deals [skip ci]" && git push)
